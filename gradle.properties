# --- Gradle / JVM ---
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=false
org.gradle.configuration-cache=false

# --- AndroidX ---
android.useAndroidX=true
# AGP 9: у нас свой Kotlin Gradle Plugin и compose-плагин,
# поэтому встроенный Kotlin AGP отключаем (официально поддерживаемый флаг).
android.builtInKotlin=false
# AGP 9: старый DSL-режим нужен, чтобы Kotlin Gradle Plugin 2.4.10 работал
# (официально поддерживаемый escape hatch, так же мигрирует Flutter).
android.newDsl=false

# --- Kotlin ---
kotlin.code.style=official
kotlin.incremental=true

# --- Release signing (перекрывается CI secrets / -P свойствами) ---
# KEYSTORE_FILE=/absolute/path/release.jks
# KEYSTORE_PASSWORD=...
# KEY_ALIAS=...
# KEY_PASSWORD=...
