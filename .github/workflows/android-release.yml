name: Build & Release APK

on:
  push:
    branches:
      - main
      - "arena/**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Release APK (R8 + minify)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          cache-read-only: false

      - name: Подготовка ключа подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.jks"
            echo "Используется ключ из секретов репозитория."
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/keys/release.jks" \
              -storetype JKS \
              -keyalg RSA -keysize 4096 -validity 10000 \
              -alias ybrowser \
              -storepass ybrowser2026 -keypass ybrowser2026 \
              -dname "CN=Yandex Browser Mobile, OU=Mobile, O=Browser, L=Moscow, C=RU"
            echo "::warning::Секреты подписи не заданы — APK подписан временным ключом. Добавьте ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD, чтобы обновления ставились поверх предыдущих версий."
          fi

      - name: Сборка release APK (arm64 / armv7 / x86_64)
        id: build
        run: |
          set -o pipefail
          export KEYSTORE_FILE="$RUNNER_TEMP/keys/release.jks"
          export KEYSTORE_PASSWORD="${KEYSTORE_PASSWORD:-ybrowser2026}"
          export KEY_ALIAS="${KEY_ALIAS:-ybrowser}"
          export KEY_PASSWORD="${KEY_PASSWORD:-ybrowser2026}"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log"

      # Диагностика: если сборка упала — выкладываем хвост лога комментарием в PR,
      # чтобы ошибки компиляции были видны прямо в пул-реквесте.
      - name: Отчёт о размере (в PR)
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -e
          if [ -z "$PR_NUMBER" ]; then exit 0; fi
          {
            echo "### 📦 Отчёт о размере сборки"
            echo ""
            echo '```'
            du -h app/build/outputs/apk/release/*.apk 2>/dev/null || echo "APK нет"
            echo ""
            echo "--- крупнейшие файлы внутри arm64 APK ---"
            unzip -l app/build/outputs/apk/release/*arm64-v8a*.apk 2>/dev/null | sort -k1 -n -r | head -15 || true
            echo ""
            echo "--- AAR движка в кэше Gradle ---"
            find ~/.gradle/caches/modules-2/files-2.1 -name "geckoview*.aar" -exec du -h {} + 2>/dev/null || true
            echo '```'
          } > "$RUNNER_TEMP/size.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/size.md" || true

      - name: Лог ошибок в PR
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$PR_NUMBER" ]; then echo "PR не найден — пропускаем"; exit 0; fi
          LOG="$RUNNER_TEMP/build.log"
          {
            echo "### ❌ Сборка упала"
            echo ""
            echo "**Ошибки компиляции/сборки:**"
            echo '```'
            grep -nE -A 12 "^e: |error: |Unresolved reference|Type mismatch|Expecting|None of the following|Caused by: " "$LOG" 2>/dev/null | head -120 || echo "нет строк с ошибками"
            echo '```'
            echo ""
            echo "<details><summary>Хвост лога</summary>"
            echo ""
            echo '```'
            tail -c 6000 "$LOG" 2>/dev/null || echo "лог недоступен"
            echo '```'
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"
          gh pr comment "$PR_NUMBER" --body-file "$RUNNER_TEMP/comment.md" || true

      - name: Размеры APK
        run: |
          ls -lh app/build/outputs/apk/release/ || true
          du -h app/build/outputs/apk/release/*.apk || true

      - name: Контрольные суммы
        working-directory: app/build/outputs/apk/release
        run: sha256sum *.apk > SHA256SUMS.txt && cat SHA256SUMS.txt

      - name: Загрузка APK
        uses: actions/upload-artifact@v4
        with:
          name: yandex-browser-release-apk
          if-no-files-found: error
          retention-days: 30
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
            app/build/outputs/mapping/release/mapping.txt

      - name: Публикация релиза (по тегу)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/SHA256SUMS.txt
          generate_release_notes: true
          name: "Яндекс Браузер ${{ github.ref_name }}"
          body: |
            Готовые подписанные APK (GeckoView 155, не WebView).

            | Файл | Для кого |
            |------|----------|
            | `*-arm64-v8a.apk` | почти все телефоны с 2017 года и новее |
            | `*-armeabi-v7a.apk` | старые 32-битные устройства |
            | `*-x86_64.apk` | эмуляторы и планшеты на Intel |

            Установка: скачайте нужный APK на телефон и откройте его
            (разрешите установку из неизвестных источников).

            Проверка целостности: `sha256sum -c SHA256SUMS.txt`.
